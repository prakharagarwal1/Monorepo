name: academy-monorepo

services:
  web:
    container_name: academy-monorepo-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - apps/web/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: apps/web
        - action: rebuild
          path: packages
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: pnpm-workspace.yaml
        - action: restart
          path: apps/web/.env
    restart: unless-stopped

  api-gateway:
    container_name: academy-monorepo-api-gateway
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      students-service:
        condition: service_healthy
      teachers-service:
        condition: service_healthy
      courses-service:
        condition: service_healthy
      enrollments-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: apps/api-gateway
        - action: rebuild
          path: packages
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: pnpm-workspace.yaml
        - action: restart
          path: .env
    restart: unless-stopped

  students-service:
